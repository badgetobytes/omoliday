name: Verify Omoliday
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm nodejs qt6-declarative python shellcheck git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the model, the packaging and the network guards
        run: bash scripts/check.sh
